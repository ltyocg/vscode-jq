name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install pnpm
        run: npm install --global pnpm@12.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm test
      - name: Package and verify VSIX
        run: pnpm run package
      - name: VS Code extension host (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run test:extension
      - name: VS Code extension host (Windows)
        if: runner.os == 'Windows'
        run: pnpm run test:extension
